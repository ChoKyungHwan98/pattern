[package]
name = "combat-ai-workbench"
version = "0.2.0"
description = "전투 AI 제작소"
authors = ["local"]
edition = "2021"

[lib]
name = "combat_ai_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
